<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randevularım - BarberApp</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-material-ui/material-ui.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/appointments.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-left">
                <a href="/customer/dashboard.html" class="logo">
                    <i class="fas fa-cut"></i>
                    BarberApp
                </a>
            </div>

            <div class="header-right">
                <div class="user-menu">
                    <a href="/customer/new-appointment.html" class="nav-link">
                        <i class="fas fa-calendar-plus"></i>
                        <span>Yeni Randevu</span>
                    </a>
                    <a href="/customer/appointments.html" class="nav-link active">
                        <i class="fas fa-history"></i>
                        <span>Randevularım</span>
                    </a>
                    <a href="/customer/favorites.html" class="nav-link">
                        <i class="fas fa-heart"></i>
                        <span>Favorilerim</span>
                    </a>
                    <a href="#" onclick="logout()" class="nav-link">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Çıkış Yap</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="appointment-container">
        <section class="appointment-section">
            <div class="section-header">
                <div class="section-title">
                    <h2>Randevularım</h2>
                    <p class="section-subtitle">Tüm randevularınızı buradan takip edebilirsiniz</p>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Randevu ara...">
                    <i class="fas fa-search"></i>
                </div>
            </div>
            <div id="appointmentsGrid"></div>
        </section>
    </main>

    <!-- Toast Message -->
    <div id="toast" class="toast"></div>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="../js/config/firebase.js"></script>
    
    <!-- App Scripts -->
    <script src="../js/common.js"></script>
    <script src="../js/customer/appointments.js"></script>
</body>
</html>
