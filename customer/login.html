<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müşteri Girişi - BarberApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="../index.html" class="logo">
                    <i class="fas fa-cut"></i>
                    BarberApp
                </a>
                <h1>Müşteri Girişi</h1>
                <p>Hesabınıza giriş yaparak randevu alabilirsiniz.</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">E-posta</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Şifre</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" required>
                        <button type="button" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group remember-forgot">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember">
                        <label for="remember">Beni hatırla</label>
                    </div>
                    <a href="reset-password.html" class="forgot-password">
                        Şifremi unuttum
                    </a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i>
                    Giriş Yap
                </button>
            </form>

            <div class="auth-footer">
                <p>Hesabınız yok mu?</p>
                <a href="register.html" class="btn btn-outline btn-block">
                    <i class="fas fa-user-plus"></i>
                    Yeni Hesap Oluştur
                </a>
            </div>
        </div>
    </div>

    <!-- Toast Messages -->
    <div class="toast" id="toast"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Config ve Servisler -->
    <script src="../js/config/firebase.js"></script>
    <script src="../js/services/auth.service.js"></script>
    <script src="../js/services/settings.service.js"></script>
    
    <!-- App Scripts -->
    <script src="../js/config.js"></script>
    <script src="js/maintenance.js"></script>
    <script src="../js/customer/login.js"></script>
</body>
</html>
