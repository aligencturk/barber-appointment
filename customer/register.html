<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müşteri Kaydı - BarberApp</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h2>Müşteri Hesabı Oluştur</h2>
            </div>

            <div class="steps">
                <div class="step active" data-step="1">1</div>
                <div class="step" data-step="2">2</div>
                <div class="step" data-step="3">3</div>
            </div>

            <form id="registerForm" class="auth-form">
                <!-- Step 1: Personal Information -->
                <div class="form-step active" data-step="1">
                    <div class="form-group">
                        <label for="fullName">Ad Soyad</label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="fullName" name="fullName" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-primary" onclick="nextStep(1)">İleri</button>
                    </div>
                </div>

                <!-- Step 2: Contact Information -->
                <div class="form-step" data-step="2">
                    <div class="form-group">
                        <label for="phone">Telefon Numarası</label>
                        <div class="input-group">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="phone" name="phone" required placeholder="05XX XXX XX XX">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">E-posta Adresi</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="prevStep(2)">Geri</button>
                        <button type="button" class="btn btn-primary" onclick="nextStep(2)">İleri</button>
                    </div>
                </div>

                <!-- Step 3: Password -->
                <div class="form-step" data-step="3">
                    <div class="form-group">
                        <label for="password">Şifre</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" required>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Şifre Tekrar</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                            <button type="button" class="toggle-password" onclick="toggleConfirmPasswordVisibility()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="terms" name="terms" required>
                            <label for="terms">
                                <a href="/terms" target="_blank">Kullanım Koşulları</a>'nı kabul ediyorum
                            </label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="prevStep(3)">Geri</button>
                        <button type="submit" class="btn btn-primary">Hesap Oluştur</button>
                    </div>
                </div>
            </form>

            <div class="auth-footer">
                <p>Zaten hesabınız var mı? <a href="/customer/login.html">Giriş Yapın</a></p>
            </div>
        </div>
    </div>

    <div id="loadingSpinner" class="loading-spinner" style="display: none;">
        <div class="spinner"></div>
        <p>Hesabınız oluşturuluyor...</p>
    </div>

    <div id="toastMessage" class="toast-message" style="display: none;"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Firebase Config ve Servisler -->
    <script src="../js/config/firebase.js"></script>
    <script src="../js/services/auth.service.js"></script>
    <script src="../js/services/settings.service.js"></script>
    <script src="js/maintenance.js"></script>

    <!-- Custom JS -->
    <script src="/js/auth.js"></script>
    <script src="/js/customer-register.js"></script>
</body>
</html>
