<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randevular - BarberApp</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="../admin/js/config/firebase.js"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/appointments.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Rest of the file remains unchanged -->
    
    <script>
        // Firebase'in yüklendiğini kontrol et
        function checkFirebaseServices() {
            return new Promise((resolve, reject) => {
                const maxAttempts = 10;
                let attempts = 0;

                const check = () => {
                    attempts++;
                    console.log(`Firebase servisleri kontrol ediliyor... (${attempts}/${maxAttempts})`);

                    if (window.firebase && window.auth && window.db) {
                        console.log('Firebase servisleri başarıyla yüklendi');
                        resolve(true);
                    } else if (attempts < maxAttempts) {
                        setTimeout(check, 500);
                    } else {
                        reject(new Error('Firebase servisleri yüklenemedi'));
                    }
                };

                check();
            });
        }

        // Sayfa yüklendiğinde Firebase servislerini kontrol et
        window.addEventListener('load', async () => {
            try {
                await checkFirebaseServices();
            } catch (error) {
                console.error('Firebase başlatma hatası:', error);
            }
        });
    </script>
</body>
</html>
